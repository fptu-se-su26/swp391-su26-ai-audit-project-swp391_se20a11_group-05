spring.application.name=SmartCity
server.port=8081
# Load local secrets when present. Supports running from Backend or repository root.
spring.config.import=optional:file:./application-local.properties,optional:file:./Sources/Backend/application-local.properties
# NOTE: Bật SSL thì set server.ssl.enabled=true + cung cấp keystore
server.ssl.enabled=false
# server.ssl.key-store=${KEYSTORE_PATH}
# server.ssl.key-store-password=${KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
spring.profiles.active=supabase



# JPA/Hibernate properties
spring.jpa.hibernate.ddl-auto=validate
# Enable SQL initialization to run schema.sql before Hibernate validation
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.jpa.open-in-view=false
# [SECURITY FIX] Tắt show-sql ở production — tốn I/O và lộ query structure
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ═══════════════════════════════════════════════════════════════
# HIKARICP CONNECTION POOL
# ═══════════════════════════════════════════════════════════════
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Phát hiện connection bị rò rỉ (leak) sau 60s không trả về pool
spring.datasource.hikari.leak-detection-threshold=60000

# ═══════════════════════════════════════════════════════════════
# JWT — BẮT BUỘC set biến môi trường JWT_SECRET khi production
# ═══════════════════════════════════════════════════════════════
# Secret key cho JWT (tối thiểu 256 bits cho HS256).
# ⚠️  Set biến môi trường JWT_SECRET = một chuỗi ngẫu nhiên dài ít nhất 32 ký tự
#     Trên Windows: $env:JWT_SECRET="<random-64-char-string>"
#     Trên Linux:   export JWT_SECRET="<random-64-char-string>"
jwt.secret=${JWT_SECRET:my-default-secret-key-for-local-dev-1234567890123456}
# [SECURITY FIX] 15 phút thay vì 7 ngày — giảm cửa sổ tấn công khi token bị đánh cắp
jwt.expiration-ms=604800000

# ═══════════════════════════════════════════════════════════════
# ENCRYPTION — AES-256 key for sensitive DB columns (mfa_secret)
# ⚠️  BẮT BUỘC: Set biến môi trường ENCRYPTION_SECRET (exactly 32 chars)
#     Windows: $env:ENCRYPTION_SECRET="your-32-char-secret-key-here"
#     Linux:   export ENCRYPTION_SECRET="your-32-char-secret-key-here"
# ═══════════════════════════════════════════════════════════════
# [SECURITY FIX] Bỏ default placeholder — bắt buộc set ENCRYPTION_SECRET trong môi trường
# Nếu không set, EncryptionService sẽ fail-fast khi khởi động
encryption.secret=${ENCRYPTION_SECRET:}

# ─── Groq AI API Key Pool ───────────────────────────────────────
# Thêm nhiều key cách nhau bởi dấu phẩy để tăng throughput
# Lấy key miễn phí tại: https://console.groq.com/keys
groq.api-keys=${GROQ_API_KEYS:}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.cooling-seconds=60

# ─── Gemini API (Fallback khi Groq pool cạn) ─────────────────────
# Lấy key tại: https://aistudio.google.com/app/apikey
# Hỗ trợ nhiều key: gemini.api-keys=key1,key2
gemini.api-keys=${GEMINI_API_KEYS:}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash}
gemini.cooling-seconds=30

# ─── DeepSeek API ───────────────────────────────────────────
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.model=${DEEPSEEK_MODEL:deepseek-chat}

# ─── Admin API Security (AdminApiKeyFilter) ───────────────────────
# Header: X-Admin-Token: <giá trị này>
# Bảo vệ: /api/ai/pool-reset, /api/ai/pool-stats, /api/ai/metrics
# ⚠️  Set ADMIN_API_TOKEN trong biến môi trường cho production
admin.api-token=${ADMIN_API_TOKEN:}

# ─── WebClient (reactive) ────────────────────────────────────────
spring.codec.max-in-memory-size=5MB

# ═══════════════════════════════════════════════════════════════
# FILE UPLOAD
# ═══════════════════════════════════════════════════════════════
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_ANON_KEY:${SUPABASE_SERVICE_ROLE_KEY:}}
supabase.bucket=${SUPABASE_STORAGE_BUCKET:feedback-images}

# ─── Scheduling (cho GroqKeyPool + GeminiKeyPool recovery) ───────
spring.task.scheduling.pool.size=2

# ─── Resilience4j Configuration ─────────────────────────────────────
resilience4j.circuitbreaker.instances.groq.sliding-window-size=10
resilience4j.circuitbreaker.instances.groq.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.groq.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.groq.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.groq.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.gemini.sliding-window-size=10
resilience4j.circuitbreaker.instances.gemini.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gemini.wait-duration-in-open-state=30s

resilience4j.retry.instances.llm.max-attempts=3
resilience4j.retry.instances.llm.wait-duration=1s
resilience4j.retry.instances.llm.exponential-backoff-multiplier=2
resilience4j.retry.instances.llm.retry-exceptions[0]=java.net.SocketTimeoutException
resilience4j.retry.instances.llm.retry-exceptions[1]=org.springframework.web.reactive.function.client.WebClientRequestException
resilience4j.retry.instances.llm.retry-exceptions[2]=java.util.concurrent.TimeoutException

resilience4j.timelimiter.instances.llm.timeout-duration=30s

resilience4j.ratelimiter.instances.llm.limit-for-period=100
resilience4j.ratelimiter.instances.llm.limit-refresh-period=1s
resilience4j.ratelimiter.instances.llm.timeout-duration=0s

# ─── Twilio SMS Configuration ─────────────────────────────────────
# ⚠️  BẮT BUỘC: Set biến môi trường — KHÔNG được hardcode credentials ở đây!
#     Windows: $env:TWILIO_ACCOUNT_SID="AC..."
#     Linux:   export TWILIO_ACCOUNT_SID="AC..."
# SecurityManager sẽ tự động đọc từ K8s Secret / Docker Secret / Env Variable
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}

# ─── Spring Mail Configuration for OTP Gmail delivery ──────────────
# ⚠️  BẮT BUỘC: Set biến môi trường — KHÔNG được hardcode credentials ở đây!
#     Windows PowerShell:
#       $env:SPRING_MAIL_HOST="smtp.gmail.com"
#       $env:SPRING_MAIL_USERNAME="your_email@gmail.com"
#       $env:SPRING_MAIL_PASSWORD="your_app_password_16_chars"
#     Linux/macOS:
#       export SPRING_MAIL_HOST=smtp.gmail.com
#       export SPRING_MAIL_USERNAME=your_email@gmail.com
#       export SPRING_MAIL_PASSWORD=your_app_password_16_chars
# Local development can instead use the ignored Sources/Backend/application-local.properties file.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:smartcityversion1@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# ─── HTTPS Redirect Toggle (tắt ở môi trường dev/test) ──────────────
# true  = bật HTTP→HTTPS redirect (production)
# false = tắt redirect (local development)
security.https-redirect.enabled=${HTTPS_REDIRECT_ENABLED:false}

# ─── Auth Rate Limiter ────────────────────────────────────────────
# Login: 5 lần / 15 phút theo IP (chống Brute-force)
rate-limit.login.max-attempts=${RATE_LIMIT_LOGIN_MAX:5}
rate-limit.login.window-minutes=${RATE_LIMIT_LOGIN_WINDOW:15}
# SMS OTP: 3 lần / 10 phút theo số điện thoại (chống spam Twilio)
rate-limit.sms.max-attempts=${RATE_LIMIT_SMS_MAX:3}
rate-limit.sms.window-minutes=${RATE_LIMIT_SMS_WINDOW:10}
# Register: 5 lần / 60 phút theo IP (chống tạo tài khoản hàng loạt)
rate-limit.register.max-attempts=${RATE_LIMIT_REGISTER_MAX:5}
rate-limit.register.window-minutes=${RATE_LIMIT_REGISTER_WINDOW:60}

# Jackson Configuration
spring.jackson.time-zone=Asia/Ho_Chi_Minh

