# =================================================================
# SUPABASE DEPLOYMENT CONFIGURATION
# Profile: supabase
# Chạy với: java -jar app.jar --spring.profiles.active=supabase
# =================================================================

spring.application.name=SmartCity-Supabase

# ─── Supabase PostgreSQL + PGVector ──────────────────────────────
# Lấy URL này ở mục Project Settings > Database > Connection string (URI)
# ⚠️  BẢO MẬT: Đặt SUPABASE_DB_URL, SUPABASE_DB_USER, SUPABASE_DB_PASSWORD
#    dưới dạng biến môi trường, KHÔNG hardcode trong file này.

# spring.datasource.url=${SUPABASE_DB_URL:}
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=${SUPABASE_DB_USER:}
# spring.datasource.password=${SUPABASE_DB_PASSWORD:}

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0&sslmode=require}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SUPABASE_DB_USER:postgres.lbzcfhavzhfmeqjncsno}
spring.datasource.password=${SUPABASE_DB_PASSWORD:thanhbinh13405@}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Supabase Storage - dùng cho upload ảnh/video phản ánh.
# BẮT BUỘC set bằng biến môi trường, không hardcode service role key trong source.
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:feedback-media}

# ─── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Supabase migrations are managed from /supabase/migrations.
# Keep Flyway off so the legacy classpath migration is not applied by default.
spring.flyway.enabled=false

# ─── Connection Pool (HikariCP) ──────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Disable Docker Compose support
spring.docker.compose.enabled=false
