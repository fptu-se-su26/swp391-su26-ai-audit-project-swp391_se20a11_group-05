# =================================================================
# RAG MODULE CONFIGURATION
# Profile: rag (dùng khi chuyển sang PostgreSQL + PGVector)
# Chạy với: java -jar app.jar --spring.profiles.active=rag
# =================================================================

spring.application.name=SmartCity-RAG

# ─── PostgreSQL + PGVector ───────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/ragdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ─── JPA / Hibernate ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway Migration ────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── Spring AI (Uncomment khi có API key) ────────────────────────
# spring.ai.openai.api-key=${OPENAI_API_KEY}
# spring.ai.openai.embedding.model=text-embedding-3-small
# spring.ai.openai.chat.model=gpt-4o-mini

# ─── Redis (Uncomment khi có Redis) ──────────────────────────────
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.cache.type=redis

# ─── Actuator ────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}

# ─── Async Thread Pool ───────────────────────────────────────────
# Virtual Threads (Java 21) — tự động dùng cho @Async
spring.threads.virtual.enabled=true

# ─── Logging ─────────────────────────────────────────────────────
logging.level.com.example.smartcity.rag=DEBUG
logging.level.org.springframework.web=INFO
# Thêm MDC parameters vào Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId:-SYSTEM}] [%X{userId:-SYS}] [%thread] %logger{36} - %msg%n

# ─── Resilience4j Config ─────────────────────────────────────────
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10
resilience4j.circuitbreaker.configs.default.failureRateThreshold=50
resilience4j.circuitbreaker.configs.default.waitDurationInOpenState=60s
resilience4j.circuitbreaker.configs.default.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.configs.default.minimumNumberOfCalls=5
resilience4j.circuitbreaker.configs.default.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.circuitbreaker.instances.groq.baseConfig=default
resilience4j.circuitbreaker.instances.gemini.baseConfig=default

